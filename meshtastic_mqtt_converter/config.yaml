name: Meshtastic MQTT Converter
version: "1.1.0"
slug: meshtastic_mqtt_converter
description: Converts encrypted Meshtastic Protobuf MQTT packets (/2/e/) to JSON (/2/json/) and vice versa
url: https://github.com/tylerpieper/mqtt-converter
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
options:
  broker: 10.0.123.41
  port: 1883
  username: ""
  password: ""
  root_topic: msh
  region: US/AZ/+
  psk: default
  channels:
    - name: MediumFast
      psk: default
  debug: false
schema:
  broker: str
  port: port
  username: str?
  password: password?
  root_topic: str
  region: str
  psk: str?
  channels:
    - name: str
      psk: str
  debug: bool
